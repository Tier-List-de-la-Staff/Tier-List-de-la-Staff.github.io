<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cadavre exquis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="jeu.css">
<style>
.wrap { max-width: 860px; }
.atelier { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: center; }
@media (max-width: 680px) { .atelier { grid-template-columns: minmax(0, 1fr); gap: 16px; } }
.stage { display: flex; flex-direction: column; align-items: center; gap: 10px; }
#face { width: min(100%, 340px); touch-action: pan-y; cursor: grab; }
#face .band.drag { transition: none; }
#face .band.out-l { transform: translateX(-100%); transition: transform .16s ease-in; }
#face .band.out-r { transform: translateX(100%); transition: transform .16s ease-in; }
#face .band.in-l { transform: translateX(-100%); transition: none; }
#face .band.in-r { transform: translateX(100%); transition: none; }
.surnom { font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: clamp(30px, 8vw, 40px); line-height: 1.05; text-align: center; overflow-wrap: anywhere; margin: 0; }
.surnom small { display: block; font: 500 13px var(--font-body); font-style: normal; color: var(--muted); margin-top: 4px; }
.knobs { display: flex; flex-direction: column; gap: 10px; }
.knob { display: grid; grid-template-columns: 4.8em 46px minmax(0, 1fr) 46px; align-items: center; gap: 8px; }
.knob b { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.knob span { text-align: center; font-weight: 600; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.knob .btn { padding: 10px 0; font-size: 14px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
.actions .btn.wide { grid-column: 1 / -1; }
@media (prefers-reduced-motion: reduce) { #face .band, #face .band.out-l, #face .band.out-r { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <nav class="topnav"><a href="../">&larr; Menu</a></nav>
  <header>
    <h1>Cadavre <span>exquis</span></h1>
    <p class="tag">Le front de l'un, les yeux d'un autre, le nez et la bouche de deux autres : fabrique les collègues les plus improbables.</p>
  </header>

  <section class="panel atelier">
    <div class="stage">
      <div id="face" aria-label="Visage recomposé"></div>
      <p class="hint">Glisse un morceau du visage vers la gauche ou la droite pour le changer.</p>
    </div>
    <div class="knobs">
      <p class="surnom" id="surnom" aria-live="polite"></p>
      <div id="rows" class="knobs"></div>
      <div class="actions">
        <button class="btn primary wide" id="dice" type="button">🎲 Tout mélanger</button>
        <button class="btn" id="same" type="button">Remettre d'aplomb</button>
        <button class="btn" id="save" type="button">Enregistrer l'image</button>
      </div>
      <p class="status" id="status" aria-live="polite"></p>
    </div>
  </section>
</div>

<script src="noms.js"></script>
<script src="commun.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const { NOMS, PARTIES, LARGE, HAUT, src, visage, surnom } = window.CE;
  const T = NOMS.length, face = $("face");
  const rnd = () => Math.floor(Math.random() * T);
  // 4 collègues différents au départ
  let mix = [];
  const shuffle = () => { const a = [...Array(T).keys()]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a.slice(0, 4); };
  mix = shuffle();

  PARTIES.forEach((p, k) => {
    const kn = document.createElement("div"); kn.className = "knob";
    kn.innerHTML = `<b></b><button class="btn" type="button">◀</button><span></span><button class="btn" type="button">▶</button>`;
    kn.querySelector("b").textContent = p.nom;
    const [a, b] = kn.querySelectorAll("button");
    a.setAttribute("aria-label", `${p.nom} : précédent`); b.setAttribute("aria-label", `${p.nom} : suivant`);
    a.onclick = () => step(k, -1); b.onclick = () => step(k, 1);
    $("rows").appendChild(kn);
  });

  function draw() {
    visage(face, mix);
    [...$("rows").children].forEach((kn, k) => { kn.querySelector("span").textContent = NOMS[mix[k]]; });
    const same = mix.every(id => id === mix[0]);
    $("surnom").innerHTML = "";
    $("surnom").append(surnom(mix));
    const s = document.createElement("small"); s.textContent = same ? "L'original, en un seul morceau" : "Le nom de ta créature";
    $("surnom").appendChild(s);
    $("status").textContent = "";
  }

  // Change un morceau : la bande sort d'un côté et la nouvelle entre de l'autre.
  function step(k, dir) {
    const band = face.children[k];
    band.classList.remove("drag"); band.style.transform = "";
    band.classList.add(dir > 0 ? "out-l" : "out-r");
    setTimeout(() => {
      mix[k] = (mix[k] + dir + T) % T; draw();
      band.classList.remove("out-l", "out-r"); band.classList.add(dir > 0 ? "in-r" : "in-l");
      void band.offsetWidth; band.classList.remove("in-l", "in-r");
    }, 160);
  }

  // Glisser du doigt (ou de la souris) sur une bande
  let drag = null;
  face.addEventListener("pointerdown", (e) => {
    const band = e.target.closest(".band"); if (!band) return;
    drag = { band, k: +band.dataset.k, x: e.clientX, y: e.clientY, dx: 0, on: false };
  });
  window.addEventListener("pointermove", (e) => {
    if (!drag) return;
    drag.dx = e.clientX - drag.x;
    if (!drag.on && Math.abs(drag.dx) > 8 && Math.abs(drag.dx) > Math.abs(e.clientY - drag.y)) { drag.on = true; drag.band.classList.add("drag"); }
    if (drag.on) drag.band.style.transform = `translateX(${drag.dx}px)`;
  });
  const endDrag = () => {
    if (!drag) return;
    const { band, k, dx, on } = drag; drag = null;
    if (!on) return;
    if (Math.abs(dx) > 40) step(k, dx < 0 ? 1 : -1);
    else { band.classList.remove("drag"); band.style.transform = ""; }
  };
  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", endDrag);

  $("dice").onclick = () => {
    const next = shuffle();
    PARTIES.forEach((p, k) => setTimeout(() => { const d = next[k] - mix[k]; if (d) { const band = face.children[k]; band.classList.add(k % 2 ? "out-r" : "out-l"); setTimeout(() => { mix[k] = next[k]; draw(); band.classList.remove("out-l", "out-r"); band.classList.add(k % 2 ? "in-l" : "in-r"); void band.offsetWidth; band.classList.remove("in-l", "in-r"); }, 160); } }, k * 90));
  };
  // Les 4 morceaux reviennent au propriétaire du front
  $("same").onclick = () => { PARTIES.forEach((p, k) => { if (k && mix[k] !== mix[0]) setTimeout(() => { const band = face.children[k]; band.classList.add("out-l"); setTimeout(() => { mix[k] = mix[0]; draw(); band.classList.remove("out-l"); band.classList.add("in-r"); void band.offsetWidth; band.classList.remove("in-r"); }, 160); }, k * 90); }); };

  // Enregistre le visage en PNG, dans un ovale
  $("save").onclick = async () => {
    const c = document.createElement("canvas"); c.width = LARGE; c.height = HAUT;
    const g = c.getContext("2d");
    g.beginPath(); g.ellipse(LARGE / 2, HAUT / 2, LARGE / 2, HAUT / 2, 0, 0, 2 * Math.PI); g.clip();
    try {
      const imgs = await Promise.all(mix.map(id => new Promise((ok, ko) => { const im = new Image(); im.onload = () => ok(im); im.onerror = ko; im.src = src(id); })));
      PARTIES.forEach((p, k) => g.drawImage(imgs[k], 0, p.y, LARGE, p.h, 0, p.y, LARGE, p.h));
      const a = document.createElement("a");
      a.download = `cadavre-exquis-${surnom(mix).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()}.png`;
      a.href = c.toDataURL("image/png"); a.click();
    } catch (e) { $("status").textContent = "L'image n'a pas pu être créée. Recharge la page et réessaie."; }
  };

  draw();
})();
</script>
</body>
</html>
