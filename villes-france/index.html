<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tier list</title>
<!-- Ce fichier est identique pour toutes les tier lists : tout ce qui change est dans config.js -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/tierlist.css">
</head>
<body>
<div class="wrap" id="app">
  <nav class="topnav">
    <a href="../">&larr; Menu</a>
    <a class="next" href="verdict.html">Voir le verdict &rarr;</a>
  </nav>
  <header>
    <div>
      <h1 id="titre">Tier list</h1>
      <p class="sub" id="consigne"></p>
    </div>
    <div class="who">
      <label for="participant">Participant</label>
      <input id="participant" type="text" placeholder="Votre nom" autocomplete="off" maxlength="40">
    </div>
  </header>

  <section class="board" id="board" aria-label="Classement"></section>

  <section class="bin">
    <div class="binhead">
      <h2>À classer<span id="count"></span></h2>
      <div class="tools">
        <button class="btn primary" id="send" type="button">Envoyer mon classement</button>
        <button class="btn" id="png" type="button">Télécharger en PNG</button>
        <button class="btn" id="reset" type="button">Tout remettre à classer</button>
      </div>
    </div>
    <div class="zone" id="pool" data-tier="pool"></div>
    <p class="hint" id="hint"></p>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../assets/site.js"></script>
<script src="config.js"></script>
<script src="../assets/tierlist.js"></script>
</body>
</html>
