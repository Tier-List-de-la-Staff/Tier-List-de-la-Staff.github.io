<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qui se cache ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="jeu.css">
<style>
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.me { display: flex; align-items: center; gap: 8px; flex: 1 1 200px; max-width: 280px; }
.me label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--mist); font-weight: 600; white-space: nowrap; }
.me input { padding: 8px 10px; font-size: 16px; }
.me input.set { border-color: var(--good); }
.links { display: flex; gap: 14px; font-weight: 600; }
.links a { color: var(--mist); text-decoration: none; }
.links a.next { color: var(--candle); }
.one-top { display: flex; justify-content: space-between; align-items: baseline; }
.one-top h2 { font-size: 26px; }
.one-top small { color: var(--mist); }
.lift { position: relative; aspect-ratio: 1 / 1; background: #fff; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.lift img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.lift .ghost { transition: transform 1.1s cubic-bezier(.5,-0.2,.3,1), opacity 1.1s ease; }
.lift.up .ghost { transform: translateY(-115%) rotate(-6deg); opacity: 0; }
.lift .verdict { position: absolute; left: 50%; bottom: 14px; transform: translate(-50%, 20px); opacity: 0; transition: opacity .4s ease .8s, transform .4s ease .8s; padding: 8px 18px; border-radius: 999px; font: 700 22px var(--font-body); white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
.lift.up .verdict { opacity: 1; transform: translate(-50%, 0); }
.lift.done .ghost, .lift.done .verdict { transition: none; }
.verdict.vrai { background: var(--good); color: #0d2416; }
.verdict.faux { background: var(--bad); color: #2a0909; }
.answer { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
.answer .btn { min-width: 120px; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--mist); font-size: 14px; }
.end { text-align: center; align-items: center; }
.end .big { font-family: var(--font-display); font-size: 64px; line-height: 1; color: var(--candle); }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="me">
      <label for="first">Prénom</label>
      <input type="text" id="first" autocomplete="given-name" placeholder="Ton prénom" maxlength="40">
    </div>
    <nav class="links"><a href="../">&larr; Menu</a><a class="next" href="classement.html">Classement &rarr;</a></nav>
  </div>
  <header>
    <h1>Qui se cache <span>?</span></h1>
    <p class="tag">21 fantômes, 21 paires d'yeux. Écris le prénom du collègue caché sous chaque drap : le fantôme s'envole et tu sais tout de suite si c'est vrai ou faux.</p>
  </header>

  <section class="panel" id="v-play">
    <div class="one-top"><h2 id="counter"></h2><small id="counter-sub"></small></div>
    <div class="lift" id="lift"><img class="photo" id="photo" alt=""><img class="ghost" id="ghost" alt=""><span class="verdict" id="verdict"></span></div>
    <div class="answer">
      <input type="text" id="guess" placeholder="C'est…" maxlength="60" enterkeyhint="done" aria-label="Ta réponse">
      <button class="btn primary" id="main" type="button">Valider</button>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <div class="foot"><button class="linkish" id="prev" type="button">&larr; Précédent</button><span id="score"></span></div>
  </section>

  <section class="panel end" id="v-end" hidden>
    <h2>Partie terminée</h2>
    <div class="big" id="final"></div>
    <p class="hint" id="end-msg"></p>
    <p class="status" id="send-status" aria-live="polite"></p>
    <button class="btn" id="retry" type="button" hidden>Réessayer l'envoi</button>
    <a class="btn primary" href="classement.html">Voir le classement &rarr;</a>
    <button class="linkish" id="review" type="button">Revoir mes réponses</button>
  </section>
</div>

<script src="../assets/site.js"></script>
<script src="noms.js"></script>
<script src="commun.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const { JEU, N, NOMS, ghost, photo, isCorrect } = window.QSC;
  const KEY = "qsc-partie";
  // Partie en cours, gardée sur le téléphone : { name, guesses: {"1": "..."}, locked: {"1": true}, sent }
  let me = { name: "", guesses: {}, locked: {}, sent: false }, cur = 0;
  try { const d = JSON.parse(localStorage.getItem(KEY) || "null"); if (d && typeof d.name === "string") me = Object.assign(me, d); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(me)); } catch (e) {} };
  const done = () => Object.keys(me.locked).length;
  const good = () => Object.keys(me.locked).filter(k => isCorrect(me.guesses[k], NOMS[+k - 1])).length;
  const refFor = (fs, db, name) => fs.doc(db, window.SITE.collection, JEU + "__" + name.toLowerCase());

  function show(v) { $("v-play").hidden = v !== "play"; $("v-end").hidden = v !== "end"; }

  /* ---------- Prénom (en haut à gauche) ---------- */
  // Modifiable tant qu'aucune réponse n'est validée, figé ensuite.
  function renderName() {
    const f = $("first"); f.value = me.name; f.disabled = done() > 0; f.classList.toggle("set", !!me.name);
  }
  $("first").addEventListener("input", () => { me.name = $("first").value.trim().replace(/\//g, ""); save(); $("first").classList.toggle("set", !!me.name); });
  $("first").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); $("guess").focus(); } });
  async function nameFree(name) {
    try {
      const { fs, db } = await window.chargerFirebase();
      return !(await fs.getDoc(refFor(fs, db, name))).exists();
    } catch (e) { return true; }
  }

  /* ---------- Un fantôme ---------- */
  function setVerdict() {
    const ok = isCorrect(me.guesses[String(cur + 1)], NOMS[cur]), vd = $("verdict");
    vd.className = "verdict " + (ok ? "vrai" : "faux");
    vd.textContent = ok ? "Vrai !" : `Faux : c'était ${NOMS[cur]}`;
  }
  function render() {
    const key = String(cur + 1), isDone = !!me.locked[key];
    renderName();
    $("counter").textContent = `Fantôme ${cur + 1}`;
    $("counter-sub").textContent = `sur ${N}`;
    const lift = $("lift");
    lift.classList.add("done"); lift.classList.remove("up");
    $("ghost").src = ghost(cur); $("ghost").alt = `Fantôme ${cur + 1}`;
    $("photo").src = photo(cur);
    setVerdict();
    if (isDone) lift.classList.add("up");
    void lift.offsetWidth; if (!isDone) lift.classList.remove("done");
    const g = $("guess"); g.value = me.guesses[key] || ""; g.disabled = isDone;
    $("prev").hidden = cur === 0;
    $("main").textContent = !isDone ? "Valider" : cur < N - 1 ? "Suivant →" : "Résultat →";
    $("score").textContent = `Score : ${good()} / ${done()}`;
    $("status").textContent = "";
  }
  async function validate() {
    if (!me.name) { $("status").textContent = "Écris d'abord ton prénom en haut à gauche."; $("first").focus(); return; }
    if (!done()) {
      $("main").disabled = true;
      const free = await nameFree(me.name);
      $("main").disabled = false;
      if (!free) { $("status").textContent = `Le prénom « ${me.name} » a déjà joué. Ajoute l'initiale de ton nom (ex. ${me.name} M.).`; $("first").focus(); return; }
    }
    const key = String(cur + 1);
    me.guesses[key] = $("guess").value.trim(); me.locked[key] = true; save();
    $("guess").disabled = true; $("status").textContent = "";
    renderName();
    setVerdict();
    $("lift").classList.add("up");
    $("main").textContent = cur < N - 1 ? "Suivant →" : "Résultat →";
    $("score").textContent = `Score : ${good()} / ${done()}`;
    if (done() >= N && !me.sent) send();
  }
  $("main").onclick = () => {
    if (!me.locked[String(cur + 1)]) return validate();
    if (cur < N - 1) { cur++; render(); $("guess").focus({ preventScroll: true }); }
    else end();
  };
  $("prev").onclick = () => { if (cur > 0) { cur--; render(); } };
  $("guess").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); $("main").click(); } });

  /* ---------- Fin ---------- */
  function end() {
    const s = good();
    $("final").textContent = `${s} / ${N}`;
    $("end-msg").textContent = s === N ? "Sans faute, tu connais tout le monde !" : s >= N * .7 ? "Bel œil !" : s >= N / 3 ? "Pas mal, mais certains t'ont bien eu." : "Les fantômes ont gagné cette fois.";
    renderName(); show("end");
    if (me.sent) $("send-status").textContent = "Score envoyé.";
    else send();
  }
  async function send() {
    $("retry").hidden = true;
    $("send-status").textContent = "Envoi de ton score…";
    try {
      const { fs, db } = await window.chargerFirebase();
      try {
        await fs.setDoc(refFor(fs, db, me.name), { tierlist: JEU, participant: me.name, guesses: me.guesses, date: Date.now() });
      } catch (e) {
        // Refusé si le document existe déjà : un envoi précédent a donc réussi.
        if (!(await fs.getDoc(refFor(fs, db, me.name))).exists()) throw e;
      }
      me.sent = true; save();
      $("send-status").textContent = "Score envoyé.";
    } catch (e) {
      $("send-status").textContent = "L'envoi n'a pas marché (connexion ?).";
      $("retry").hidden = false;
    }
  }
  $("retry").onclick = send;
  $("review").onclick = () => { cur = 0; render(); show("play"); };

  /* ---------- Démarrage ---------- */
  if (done() >= N) end();
  else { cur = Math.min(N - 1, done()); render(); show("play"); }
})();
</script>
</body>
</html>
